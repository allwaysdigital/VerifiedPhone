<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VerifiedPhone Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-view" class="view">
    <form id="login-form" class="login-card">
      <h1>VerifiedPhone Admin</h1>
      <label>
        Email
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit">Log in</button>
    </form>
  </div>

  <div id="dashboard-view" class="view" hidden>
    <header class="topbar">
      <h1>Shops</h1>
      <div class="topbar-actions">
        <input type="search" id="search-input" placeholder="Search phone or shop name…" />
        <button id="logout-btn" class="secondary">Log out</button>
      </div>
    </header>

    <p id="dashboard-error" class="error" hidden></p>

    <table id="shops-table">
      <thead>
        <tr>
          <th>Phone</th>
          <th>Shop Name</th>
          <th>Profile</th>
          <th>Subscription</th>
          <th>Plan</th>
          <th>OTP Bypass</th>
          <th>Joined</th>
        </tr>
      </thead>
      <tbody id="shops-tbody"></tbody>
    </table>
    <p id="empty-state" hidden>No shops found.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
